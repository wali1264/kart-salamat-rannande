name: build-platforms

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  # ================= Windows Executable Build Job =================
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build React/Vite Web App
        run: npm run build

      - name: Prepare Electron Infrastructure
        run: |
          npm install --save-dev electron electron-builder --legacy-peer-deps
          mkdir -p electron
          cat << 'EOF' > electron/main.cjs
          const { app, BrowserWindow } = require('electron');
          const path = require('path');

          function createWindow() {
            const win = new BrowserWindow({
              width: 1280,
              height: 800,
              webPreferences: {
                nodeIntegration: false,
                contextIsolation: true,
              },
              autoHideMenuBar: true,
              title: "مکتب پورتال"
            });

            win.loadFile(path.join(__dirname, '../dist/index.html'));
          }

          app.whenReady().then(() => {
            createWindow();

            app.on('activate', () => {
              if (BrowserWindow.getAllWindows().length === 0) {
                createWindow();
              }
            });
          });

          app.on('window-all-closed', () => {
            if (process.platform !== 'darwin') {
              app.quit();
            }
          });
          EOF

      - name: Configure Electron Builder
        run: |
          cat << 'EOF' > electron-builder.json
          {
            "appId": "com.maktabportal.app",
            "productName": "MaktabPortal",
            "directories": {
              "output": "dist-electron"
            },
            "files": [
              "dist/**/*",
              "electron/**/*"
            ],
            "win": {
              "target": "portable"
            }
          }
          EOF

      - name: Set Package main for Electron
        run: |
          node -e "const fs = require('fs'); const pkg = JSON.parse(fs.readFileSync('package.json')); pkg.main = 'electron/main.cjs'; fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));"

      - name: Build Windows Portable Executable
        run: npx electron-builder --win --x64

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaktabPortal-Windows-Portable
          path: dist-electron/*.exe

  # ================= Android Release APK Build Job =================
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build React/Vite Web App
        run: npm run build

      - name: Setup and Sync Capacitor Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          if [ ! -d "android" ]; then
            echo "Android directory not found. Creating brand new Capacitor android platform..."
            npx cap add android
          else
            echo "Android directory already exists."
          fi
          npx cap sync

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaktabPortal-Android-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
